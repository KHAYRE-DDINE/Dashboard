services:
  postgres:
    image: postgres:16-alpine
    container_name: altaalim-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-al_taalim}
      POSTGRES_USER: ${DB_USER:-altaalim_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password is required}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-altaalim_admin} -d ${DB_NAME:-al_taalim}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    networks:
      - altaalim-internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: altaalim-backend-prod
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-al_taalim}
      DB_USER: ${DB_USER:-altaalim_admin}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Secure 256-bit JWT Secret is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${APP_URL:-https://altaalim.edu}
      APP_URL: ${APP_URL:-https://altaalim.edu}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
    networks:
      - altaalim-internal
      - altaalim-web

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: altaalim-frontend-prod
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - altaalim-web

networks:
  altaalim-internal:
    internal: true
  altaalim-web:
    driver: bridge

volumes:
  pgdata_prod:
    name: altaalim_postgres_data
