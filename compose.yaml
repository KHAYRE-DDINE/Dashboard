services:
  postgres:
    build:
      context: ./database
      dockerfile: Dockerfile
    image: altaalim-db:16
    container_name: altaalim-postgres-dev
    environment:
      POSTGRES_DB: ${DB_NAME:-al_taalim}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-al_taalim}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - altaalim-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: altaalim-backend:dev
    container_name: altaalim-backend-dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-al_taalim}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/al_taalim
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:8080,http://localhost:8081,http://localhost:5173}
    ports:
      - "8080:8080"
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - altaalim-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: altaalim-frontend-dev
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - altaalim-net

networks:
  altaalim-net:
    driver: bridge

volumes:
  pgdata_dev:
